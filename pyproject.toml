[project]
name = "onecode"
version = "0.1.0"
description = "A code agent runtime."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.27.2",
    "pydantic>=2.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "tree-sitter",
    "tree-sitter-bash",
    "prompt-toolkit>=3.0.52",
    "textual>=0.89",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
onecode = "ui.cli.app:main"

[tool.setuptools.packages.find]
include = [
    "application*",
    "core*",
    "infrastructure*",
    "prompts*",
    "services*",
    "tools*",
    "ui*",
    "utils*",
]
exclude = ["reference*", "tests*", "docs*", "lessons*", "assets*"]

[tool.setuptools.package-data]
"ui.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
