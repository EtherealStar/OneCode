[project]
name = "onecode"
version = "0.1.0"
description = "A code agent runtime."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.27.2",
    "openai==3.18.0",
    "pydantic>=2.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "tree-sitter",
    "tree-sitter-bash",
    "prompt-toolkit>=3.0.52",
    "textual>=0.89",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=8.0.0",
    "pytest-testmon>=2.2.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
onecode = "ui.cli.app:main"

[tool.setuptools.packages.find]
include = [
    "application*",
    "core*",
    "infrastructure*",
    "prompts*",
    "services*",
    "tools*",
    "ui*",
    "utils*",
]
exclude = ["reference*", "tests*", "docs*", "lessons*", "assets*"]

[tool.setuptools.package-data]
"ui.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
include = ["*.py", "*.pyi"]
exclude = ["docs", "reference", "lessons"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
    "application",
    "core",
    "infrastructure",
    "prompts",
    "services",
    "tools",
    "ui",
    "utils",
]
