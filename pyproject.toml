[project]
name = "onecode"
version = "0.1.0"
description = "A code agent runtime."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.27.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0.1",
    "tree-sitter",
    "tree-sitter-bash",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
